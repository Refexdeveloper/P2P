steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --dockerfile=Dockerfile
      - --context=.
      - --destination=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/p2p-backend:$SHORT_SHA
      - --destination=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/p2p-backend:latest
      - --cache=true
      - --cache-ttl=168h
      - --cache-repo=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/p2p-backend-cache
  - name: 'gcr.io/google-cloud-sdk/slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - p2p-backend-rmc-business
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/p2p-backend:$SHORT_SHA
      - --region=asia-south1
      - --service-account=p2p-app-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --cpu=2
      - --memory=2Gi
      - --timeout=300
      - --max-instances=5
      - --set-env-vars=NODE_ENV=production,SERVE_CLIENT=true,DB_NAME=p2p_rmc_business,DB_USER=p2p_rmc_app,INSTANCE_CONNECTION_NAME=$_INSTANCE_CONNECTION_NAME,CORS_ORIGIN=*,APP_URL=https://p2p-backend-rmc-business-645830234926.asia-south1.run.app,API_PUBLIC_URL=https://p2p-backend-rmc-business-645830234926.asia-south1.run.app,REFEXONE_LOGIN_ENABLED=true,REFEXONE_SAML_APP_ID=0f71f9c3-751e-4004-bb9c-a3f6f007c420,REFEXONE_SAML_ACS_URL=https://p2p-backend-rmc-business-645830234926.asia-south1.run.app/api/auth/refexone/saml/acs,REFEXONE_SAML_ENTITY_ID=https://p2p-backend-rmc-business-645830234926.asia-south1.run.app/auth/refexone/saml,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_SECURE=false,GCS_BUCKET_NAME=p2p-app-storage-master-diorama-489103-u2,GOOGLE_CLOUD_PROJECT=master-diorama-489103-u2
      - --set-secrets=DB_PASSWORD=p2p-db-password:latest,JWT_SECRET=p2p-jwt-secret:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest
      - --allow-unauthenticated
      - --quiet
substitutions:
  _INSTANCE_CONNECTION_NAME: 'master-diorama-489103-u2:asia-south1:p2p-mysql'
images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/p2p-backend:$SHORT_SHA'
options:
  machineType: 'E2_HIGHCPU_8'
