<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --brand-primary: #f4553b;
      --brand-secondary: #2978b1;
      --brand-accent: #7cc144;
    }
    body { font-family: system-ui, sans-serif; padding: 24px; }
    .swatch { display: inline-block; width: 120px; height: 80px; border-radius: 12px; margin-right: 12px; color: #fff; padding: 12px; font-size: 12px; }
    .hero {
      margin-top: 20px;
      height: 120px;
      border-radius: 16px;
      background: linear-gradient(90deg, #2978b1 0%, #7cc144 50%, #f4553b 100%);
    }
    .btn {
      margin-top: 16px;
      display: inline-block;
      padding: 12px 24px;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      background: linear-gradient(135deg, #f4553b 0%, #ff7a6a 100%);
    }
  </style>
</head>
<body>
  <h2>Brand colors</h2>
  <div class="swatch" style="background:#f4553b">Primary<br>#F4553B</div>
  <div class="swatch" style="background:#2978b1">Secondary<br>#2978B1</div>
  <div class="swatch" style="background:#7cc144">Accent<br>#7CC144</div>
  <div class="hero"></div>
  <div class="btn">Create New PR</div>
</body>
</html>
